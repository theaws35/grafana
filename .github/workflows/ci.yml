name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        path:
          - terraform/modules/grafana
          - terraform/modules/prometheus
          - terraform/environments/dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform format check
        working-directory: ${{ matrix.path }}
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: ${{ matrix.path }}
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: ${{ matrix.path }}
        run: terraform validate

  ansible:
    name: Ansible lint and syntax
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible tooling
        run: |
          pip install ansible ansible-lint
          ansible-galaxy collection install -r requirements.yml

      - name: Ansible syntax check
        run: |
          for playbook in playbooks/*.yaml; do
            echo "Checking ${playbook}"
            ansible-playbook --syntax-check "${playbook}"
          done

      - name: Ansible lint
        run: ansible-lint playbooks/*.yaml

  dashboards:
    name: Validate dashboard JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate grafana-dashboards JSON files
        run: |
          python3 << 'PY'
          import json
          import sys
          from pathlib import Path

          errors = []
          for path in sorted(Path("grafana-dashboards").rglob("*.json")):
              try:
                  data = json.loads(path.read_text())
                  if "title" not in data:
                      errors.append(f"{path}: missing 'title'")
                  if "uid" not in data:
                      errors.append(f"{path}: missing 'uid'")
              except json.JSONDecodeError as exc:
                  errors.append(f"{path}: invalid JSON — {exc}")

          if errors:
              print("\n".join(errors))
              sys.exit(1)

          print(f"Validated {len(list(Path('grafana-dashboards').rglob('*.json')))} dashboard files")
          PY

  docker-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config --quiet
