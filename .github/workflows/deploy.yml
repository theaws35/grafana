name: Deploy

on:
  # Auto-deploy after CI passes on a merge to main/staging/dev
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, staging, dev]

  # Manual deploy (optional fallback)
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      component:
        description: Component to deploy
        required: true
        type: choice
        options:
          - grafana
          - grafana-al23
          - prometheus
          - prometheus-al23
          - node-exporter
          - cloudwatch
          - all

concurrency:
  group: deploy-${{ github.event.inputs.environment || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve deployment target
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      component: ${{ steps.target.outputs.component }}
      ref: ${{ steps.target.outputs.ref }}
    steps:
      - name: Determine environment and component
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"
            echo "component=${{ github.event.inputs.component }}" >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            BRANCH="${{ github.event.workflow_run.head_branch }}"
            SHA="${{ github.event.workflow_run.head_sha }}"
            case "${BRANCH}" in
              main)    ENV="prod" ;;
              staging) ENV="staging" ;;
              dev)     ENV="dev" ;;
              *)       echo "Unsupported branch: ${BRANCH}"; exit 1 ;;
            esac
            echo "environment=${ENV}" >> "$GITHUB_OUTPUT"
            echo "component=all" >> "$GITHUB_OUTPUT"
            echo "ref=${SHA}" >> "$GITHUB_OUTPUT"
          fi

  terraform-apply:
    name: Terraform apply
    runs-on: ubuntu-latest
    needs: resolve
    if: needs.resolve.outputs.component == 'all'
    environment: ${{ needs.resolve.outputs.environment }}
    defaults:
      run:
        working-directory: terraform/environments/${{ needs.resolve.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
        run: terraform init

      - name: Terraform apply
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
        run: terraform apply -auto-approve

  deploy:
    name: Ansible deploy (${{ needs.resolve.outputs.component }})
    runs-on: ubuntu-latest
    needs: [resolve, terraform-apply]
    if: |
      always() &&
      needs.resolve.result == 'success' &&
      (needs.terraform-apply.result == 'success' || needs.terraform-apply.result == 'skipped')
    environment: ${{ needs.resolve.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          pip install ansible
          cd ansible && ansible-galaxy collection install -r requirements.yml

      - name: Configure SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Select playbook
        id: playbook
        run: |
          case "${{ needs.resolve.outputs.component }}" in
            grafana)         echo "playbook=deploy_grafana.yaml" >> "$GITHUB_OUTPUT" ;;
            grafana-al23)    echo "playbook=deploy_grafana_al23.yaml" >> "$GITHUB_OUTPUT" ;;
            prometheus)      echo "playbook=deploy_prometheus.yaml" >> "$GITHUB_OUTPUT" ;;
            prometheus-al23) echo "playbook=deploy_prometheus_al23.yaml" >> "$GITHUB_OUTPUT" ;;
            node-exporter)   echo "playbook=deploy_node_exporter.yaml" >> "$GITHUB_OUTPUT" ;;
            cloudwatch)      echo "playbook=deploy_cloudwatch.yaml" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Deploy single component
        if: needs.resolve.outputs.component != 'all'
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook \
            -i inventory/hosts.yml \
            playbooks/${{ steps.playbook.outputs.playbook }} \
            -e "grafana_admin_password=${{ secrets.GRAFANA_ADMIN_PASSWORD }}" \
            -e "grafana_root_url=${{ vars.GRAFANA_ROOT_URL }}"

      - name: Deploy full stack
        if: needs.resolve.outputs.component == 'all'
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          for playbook in \
            deploy_prometheus_al23.yaml \
            deploy_grafana_al23.yaml \
            deploy_node_exporter.yaml \
            deploy_cloudwatch.yaml
          do
            ansible-playbook \
              -i inventory/hosts.yml \
              "playbooks/${playbook}" \
              -e "grafana_admin_password=${{ secrets.GRAFANA_ADMIN_PASSWORD }}" \
              -e "grafana_root_url=${{ vars.GRAFANA_ROOT_URL }}"
          done
