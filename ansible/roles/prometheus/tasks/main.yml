---
- name: Include Docker installation tasks
  ansible.builtin.include_tasks: install_docker.yml

- name: Create Prometheus directories
  ansible.builtin.file:
    path: "{{ prometheus_install_dir }}"
    state: directory
    mode: "0755"

- name: Deploy Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_install_dir }}/prometheus.yml"
    mode: "0644"
  notify: Restart prometheus container

- name: Run Prometheus container
  community.docker.docker_container:
    name: "{{ prometheus_container_name }}"
    image: "{{ prometheus_image }}"
    state: started
    restart_policy: unless-stopped
    ports:
      - "{{ prometheus_port }}:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time={{ prometheus_retention }}
      - --web.enable-lifecycle
    volumes:
      - "{{ prometheus_install_dir }}/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "{{ prometheus_data_volume }}:/prometheus"
    networks:
      - name: monitoring
    comparisons:
      image: strict
